  - heading "Glossary" [level=2] [ref=f4e1475]
  - generic [ref=f4e1476]:
    - term [ref=f4e1477]: arm
    - definition [ref=f4e1478]: One way of packaging the API. The thing being compared. Every arm gets the same tasks against the same API. The only difference is how the API is presented to the model — as MCP tools, as written docs it curls, as a code library, and so on.
    - term [ref=f4e1479]: task
    - definition [ref=f4e1480]: One question or instruction given to the model.
    - term [ref=f4e1481]: core
    - definition [ref=f4e1482]: One navigation problem, reused across five task types. The same 'find episode X' problem appears as a read, three kinds of write, and a bulk operation. Because the difficulty of finding the target is identical across all five, any difference between them is caused by what happens AFTER it is found — not by one being harder to locate.
    - term [ref=f4e1483]: run
    - definition [ref=f4e1484]: One arm attempting one task once.
    - term [ref=f4e1485]: Z0
    - definition [ref=f4e1486]: "Control: the model gets NO tools at all. It measures what the model already knew before you gave it anything. On a made-up API this should be ~0 — if it is not, the API leaked into the model's training and every result is void. On a real API it is often high, and then the tools have to beat it to be worth having."
    - term [ref=f4e1487]: Z1
    - definition [ref=f4e1488]: "Ceiling: the correct API responses are handed over up front. The model does no tool use — it just reads the data and answers. If Z1 scores 80%, then 80% is the best any packaging could do, and an arm at 75% is nearly perfect rather than mediocre. Without it you cannot tell a bad wrapper from an impossible task."
    - term [ref=f4e1489]: success rate
    - definition [ref=f4e1490]: Share of tasks the arm got right. Excludes runs that ran out of turns — those are a budget problem, not a wrong answer.
    - term [ref=f4e1491]: lift
    - definition [ref=f4e1492]: Success rate MINUS Z0's. How much the packaging actually added. An arm at 67% sounds fine until you learn Z0 scored 83% — then it is 17 points WORSE than giving the model nothing. Raw success can flatter; lift cannot.
    - term [ref=f4e1493]: pp
    - definition [ref=f4e1494]: Percentage points — the gap between two percentages. 70% minus 55% is 15 pp. Writing '15%' would be ambiguous, because 15% OF 55% is 8.25%. 'pp' says plainly that one was subtracted from the other.
    - term [ref=f4e1495]: truncated
    - definition [ref=f4e1496]: "The run hit its turn limit before answering. Not counted as wrong — it might have been one step away. Reported separately, because a high truncation rate is its own finding: the arm is spending its budget without finishing."
    - term [ref=f4e1497]: TP / true positive
    - definition [ref=f4e1498]: Answerable task, answered correctly.
    - term [ref=f4e1499]: FP / false positive
    - definition [ref=f4e1500]: A task with NO valid answer, and the model made one up. The dangerous failure. About 15% of tasks are deliberately unanswerable to catch exactly this.
    - term [ref=f4e1501]: TN / true negative
    - definition [ref=f4e1502]: Unanswerable task, correctly declined.
    - term [ref=f4e1503]: FN / false negative
    - definition [ref=f4e1504]: Answerable task, and the model failed or gave up.
    - term [ref=f4e1505]: precision
    - definition [ref=f4e1506]: Of the answers it gave, how many were right. Low precision means it answers when it should stay quiet. TP / (TP + FP).
    - term [ref=f4e1507]: recall
    - definition [ref=f4e1508]: Of the answerable tasks, how many it actually answered. Low recall means it gives up too easily. TP / (TP + FN).
    - term [ref=f4e1509]: specificity
    - definition [ref=f4e1510]: Of the unanswerable tasks, how many it correctly refused. Low specificity means it invents answers. This is the safety number.
    - term [ref=f4e1511]: F1
    - definition [ref=f4e1512]: Precision and recall combined into one score. Useful as a summary, but it ignores true negatives — so an agent that correctly refuses gets no credit for it here. Read specificity too.
    - term [ref=f4e1513]: accuracy
    - definition [ref=f4e1514]: "Share of ALL decisions that were right. Misleading when most tasks are answerable: a model that answers everything scores ~85% accuracy while being maximally unsafe."
    - term [ref=f4e1515]: balanced accuracy
    - definition [ref=f4e1516]: The average of recall and specificity. Treats 'answered correctly' and 'refused correctly' as equally important, which fixes accuracy's blind spot.
    - term [ref=f4e1517]: MCC
    - definition [ref=f4e1518]: One number from -1 to +1 summarising the whole 2x2. +1 is perfect, 0 is no better than guessing, negative is worse than guessing. Unlike accuracy it cannot be gamed by always answering — that agent scores 0. The honest single number when unanswerable tasks are rare.
    - term [ref=f4e1519]: silent failure
    - definition [ref=f4e1520]: Wrong, and stated confidently rather than hedged. Being wrong is bad; being wrong and convincing is worse, because nobody downstream will check.
    - term [ref=f4e1521]: turns
    - definition [ref=f4e1522]: Round trips between the model and the tools.
    - term [ref=f4e1523]: calls
    - definition [ref=f4e1524]: Individual API operations the model invoked.
    - term [ref=f4e1525]: static tokens
    - definition [ref=f4e1526]: Tokens spent before the model does anything. Tool schemas plus any skill or docs. An arm that loads 200 operation schemas pays for all of them on every single task.
    - term [ref=f4e1527]: cached
    - definition [ref=f4e1528]: Share of input tokens billed at the cheaper cached rate. Repeated prefixes get discounted. Writing the cache costs MORE than fresh input, so it only pays off from the second run onward.
    - term [ref=f4e1529]: $/success
    - definition [ref=f4e1530]: Total spend divided by tasks solved. The comparable figure — dollars, not tokens, because different providers count tokens differently.
    - term [ref=f4e1531]: harm
    - definition [ref=f4e1532]: "Runs that destroyed data or attempted a forbidden operation. Counts blocked attempts too: on a real API there would be no guard, so the attempt is the finding."
    - term [ref=f4e1533]: 95% CI
    - definition [ref=f4e1534]: The range the true value plausibly sits in. A wide interval means too little data to say much. If it spans zero, the difference could just as easily be nothing.
    - term [ref=f4e1535]: MDE
    - definition [ref=f4e1536]: Minimum detectable effect — the smallest gap this run could spot. With few tasks, only huge differences show up. A gap smaller than the MDE is not a finding, however suggestive the bar looks.
    - term [ref=f4e1537]: p value
    - definition [ref=f4e1538]: "Roughly: how easily chance alone could produce this gap. Below 0.05 is the usual bar. It says nothing about whether the difference is large enough to care about — that is the CI's job."
    - term [ref=f4e1539]: Holm correction
    - definition [ref=f4e1540]: Adjusts p values for testing several things at once. Test six comparisons and one will look impressive by luck. This raises the bar so that does not happen.
    - term [ref=f4e1541]: confirmatory
    - definition [ref=f4e1542]: A comparison declared BEFORE the run, in code. Only these can be called significant. Deciding what to test after seeing results is how noise becomes a headline.
    - term [ref=f4e1543]: exploratory
    - definition [ref=f4e1544]: A comparison looked at afterwards. Reported and labelled, never called significant. It can suggest the next experiment; it cannot support a claim.
    - term [ref=f4e1545]: paired within core
    - definition [ref=f4e1546]: Arms compared only on problems they both attempted. A hard problem drags every arm down, so comparing them on the same problems cancels that out.
    - term [ref=f4e1547]: refusing to pool
    - definition [ref=f4e1548]: Results that must not be averaged together. Different model, different protocol version, or a hand-written vs generated skill — averaging those answers a question nobody asked.
    - term [ref=f4e1549]: unvalidated
    - definition [ref=f4e1550]: The metric is computed, but not yet checked against ground truth. It describes what happened. It is not yet evidence of quality.
  - contentinfo [ref=f4e1551]: Controlled result. Programmatic grading only; writes are graded on final server state, never on the transcript.20 runs hit max_turns and are excluded from success rates.Never pool across model, MCP revision, skill condition, or report class.